name: Test
on: [push, pull_request]

jobs:
  common-test:
    name: Run Common Test
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    strategy:
      fail-fast: false
      matrix:
        otp: [22, 23, 24, 25, 26, 27, 28, 29]
    container:
      image: erlang:${{ matrix.otp }}-alpine
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run Common Test
        run: |
             rebar3 xref
             rebar3 dialyzer
             rebar3 ct
